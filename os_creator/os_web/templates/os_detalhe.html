{% extends "base.html" %}
{% block titulo %}OS {{ d.folio }}{% endblock %}
{% block body_class %}os-form{% endblock %}
{% block conteudo %}
{% include "os_detalhe_conteudo.html" %}
{% endblock %}
{% block scripts %}
<script>
(function () {
  var el = document.querySelector("[data-anexos]"); if (!el) return;
  fetch(el.getAttribute("data-anexos"), {credentials: "same-origin", headers: {"Accept": "application/json"}})
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { document.querySelectorAll(".det-n").forEach(function (n) { var v = j ? j[n.getAttribute("data-n")] : null; n.textContent = (v === null || v === undefined) ? "\u2014" : v; }); })
    .catch(function () { document.querySelectorAll(".det-n").forEach(function (n) { n.textContent = "\u2014"; }); });
})();
</script>
{% endblock %}
